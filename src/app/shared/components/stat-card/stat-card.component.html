<ion-card class="stat-card" [ngClass]="color">
    <ion-card-content>
        <div class="icon-wrapper">
            <ion-icon [name]="icon"></ion-icon>
        </div>
        <div class="data-wrapper">
            <h2 class="value">{{ value }}</h2>
            <p class="label">{{ label }}</p>
        </div>
    </ion-card-content>
</ion-card>
