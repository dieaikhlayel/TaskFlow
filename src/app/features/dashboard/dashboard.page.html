<ion-content class="ion-padding">
  <app-page-header title="Dashboard"></app-page-header>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <app-stat-card label="Total Tasks" [value]="taskService.totalTasks()" icon="list-outline"
      color="primary"></app-stat-card>
    <app-stat-card label="Completed" [value]="taskService.completedTasks()" icon="checkmark-circle-outline"
      color="success"></app-stat-card>
    <app-stat-card label="Pending" [value]="taskService.pendingTasks()" icon="time-outline"
      color="warning"></app-stat-card>
    <app-stat-card label="Overdue" [value]="taskService.overdueTasks()" icon="alert-circle-outline"
      color="danger"></app-stat-card>
  </div>

  <!-- Progress Section -->
  <div class="progress-section">
    <div class="progress-header">
      <h3>Overall Progress</h3>
      <span>{{ taskService.completionProgress() }}%</span>
    </div>
    <ion-progress-bar [value]="taskService.completionProgress() / 100" color="primary"></ion-progress-bar>
  </div>

  <!-- Upcoming Tasks -->
  <div class="upcoming-section">
    <h3>Upcoming Tasks</h3>
    @if (taskService.upcomingTasks().length > 0) {
    <ion-list lines="none">
      @for (task of taskService.upcomingTasks(); track task.id) {
      <ion-item class="task-item">
        <ion-label>
          <h2>{{ task.title }}</h2>
          <ion-note color="medium">{{ task.dueDate }}</ion-note>
        </ion-label>
      </ion-item>
      }
    </ion-list>
    } @else {
    <p class="empty-state">No upcoming tasks. You're all caught up!</p>
    }
  </div>
</ion-content>
