<ion-content class="ion-padding">
  <app-page-header title="Settings"></app-page-header>

  <ion-list lines="none" class="settings-list">
    <h3 class="section-title">Appearance</h3>
    <ion-item>
      <ion-icon slot="start" [name]="settingsService.isDarkMode() ? 'moon-outline' : 'sunny-outline'"></ion-icon>
      <ion-label>Dark Mode</ion-label>
      <ion-toggle slot="end" [checked]="settingsService.isDarkMode()"
        (ionChange)="settingsService.isDarkMode.set($any($event.detail).checked)">
      </ion-toggle>
    </ion-item>

    <h3 class="section-title" style="margin-top: 30px;">Data Management</h3>
    <ion-item button (click)="confirmClearData()" color="danger">
      <ion-icon slot="start" name="trash-outline"></ion-icon>
      <ion-label>Clear All Tasks</ion-label>
    </ion-item>

    <h3 class="section-title" style="margin-top: 30px;">About</h3>
    <ion-item>
      <ion-icon slot="start" name="information-circle-outline"></ion-icon>
      <ion-label>
        <h2>TaskFlow</h2>
        <p>Version 1.0.0</p>
      </ion-label>
    </ion-item>
    <ion-item lines="none">
      <ion-note class="ion-text-wrap">
        A modern task management application built with Ionic, Angular, and Capacitor. Designed for productivity.
      </ion-note>
    </ion-item>
  </ion-list>
</ion-content>
