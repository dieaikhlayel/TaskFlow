<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tasks" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Edit Task' : 'New Task' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="taskForm" (ngSubmit)="saveTask()">

    <ion-item>
      <ion-label position="stacked">Title *</ion-label>
      <ion-input formControlName="title" placeholder="Enter task title"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Description</ion-label>
      <ion-textarea formControlName="description" placeholder="Add details..." rows="3"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Category</ion-label>
      <ion-select formControlName="category">
        @for (cat of categories; track cat) {
        <ion-select-option [value]="cat">{{ cat | titlecase }}</ion-select-option>
        }
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Priority</ion-label>
      <ion-select formControlName="priority">
        <ion-select-option value="low">Low</ion-select-option>
        <ion-select-option value="medium">Medium</ion-select-option>
        <ion-select-option value="high">High</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Due Date</ion-label>
      <ion-datetime formControlName="dueDate" presentation="date"></ion-datetime>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="taskForm.invalid">
      {{ isEditMode ? 'Save Changes' : 'Create Task' }}
    </ion-button>
  </form>
</ion-content>
